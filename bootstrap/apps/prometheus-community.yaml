apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd # Application object must always live in argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts # the Helm repo URL you used with helm repo add
      chart: prometheus           # the chart name
      targetRevision: 29.47.2   # your pinned chart version
      helm:
        releaseName: prometheus   # must match your existing install
        valueFiles:
          - $values/platform/prometheus/values.yaml   # path to your values file in your repo
    - repoURL: https://github.com/julcap/k8s-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
