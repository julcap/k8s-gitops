apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-storage
  namespace: argocd            # Applications always live in ArgoCD's namespace
spec:
  project: default
  source:
    repoURL: https://github.com/julcap/k8s-gitops # your GitHub repo URL
    targetRevision: main # the branch to follow
    path: platform/local-path-storage
  destination:
    server: https://kubernetes.default.svc   # "this same cluster"
    namespace: local-path-storage
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true