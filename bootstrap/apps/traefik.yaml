apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd # Application object must always live in argocd
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts     # the Helm repo URL you used with helm repo add
      chart: traefik            # the chart name
      targetRevision: 42.1.3          # your pinned chart version
      helm:
        releaseName: traefik          # must match your existing install
        valueFiles:
          - $values/platform/traefik/values.yaml   # path to your values file in your repo
    - repoURL: https://github.com/julcap/k8s-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true