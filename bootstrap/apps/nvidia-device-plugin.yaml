apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd # Application object must always live in argocd
spec:
  project: default
  sources:
    - repoURL: https://nvidia.github.io/k8s-device-plugin # Helm repo URL you used with helm repo add
      chart: nvidia-device-plugin            # the chart name
      targetRevision: 0.20.1          # your pinned chart version
      helm:
        # releaseName: nvidia          # must match your existing install
        valueFiles:
          - $values/platform/nvidia-device-plugin/values.yaml # path to your values file in your repo
    - repoURL: https://github.com/julcap/k8s-gitops
      targetRevision: main
      ref: values
    - repoURL: https://github.com/julcap/k8s-gitops
      targetRevision: main
      path: platform/nvidia-device-plugin
      directory:
        include: 'runtimeclass.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
