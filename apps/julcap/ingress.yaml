apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: julcap-ingress
spec:
  ingressClassName: traefik
  rules:
  - host: tools-k8s.julcap.net
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: front-end
            port:
              number: 80
