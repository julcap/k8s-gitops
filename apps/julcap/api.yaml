apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: julcap-api
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: julcap-api
  labels:
    app: julcap-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: julcap-api
  template:
    metadata:
      labels:
        app: julcap-api
    spec:
      imagePullSecrets:
      - name: julcap-pull
      containers:
      - name: julcap-api
        image: registry.julcap.net/julcap/back-end:935cdc43
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        env:
         - name: DB_HOST
           value: postgres
         - name: DB_NAME
           valueFrom:
             secretKeyRef:
               name: pg-conf
               key: POSTGRES_DB
         - name: DB_USER
           valueFrom:
             secretKeyRef:
               name: pg-conf
               key: POSTGRES_USER
         - name: DB_PASSWORD
           valueFrom:
             secretKeyRef:
               name: pg-conf
               key: POSTGRES_PASSWORD
         - name: JWT_SECRET
           valueFrom:
             secretKeyRef:
               name: jwt-secret
               key: JWT_SECRET
         - name: CORS_ORIGIN
           value: "https://tools-k8s.julcap.net"
         - name: RESEND_API_KEY
           valueFrom:
             secretKeyRef:
               name: resend-api-key
               key: RESEND_API_KEY
         - name: EMAIL_PROVIDER
           value: "resend"
         - name: EMAIL_FROM
           value: "main@julcap.net"
        ports:
        - containerPort: 5000
          name: liveness-port
        readinessProbe:
          httpGet:
            path: /api/health
            port: liveness-port
          timeoutSeconds: 2
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: liveness-port
          timeoutSeconds: 3
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
