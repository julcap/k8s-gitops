apiVersion: v1
kind: Service
metadata:
  name: front-end
spec:
  selector:
    app: front-end
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: julcap-front-end
  labels:
    app: front-end
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-end
  template:
    metadata:
      labels:
        app: front-end
    spec:
      imagePullSecrets:
      - name: julcap-pull
      containers:
      - name: julcap-front-end
        image: registry.julcap.net/julcap/front-end:935cdc43
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
          name: liveness-port
        readinessProbe:
          httpGet:
            path: /
            port: liveness-port
          timeoutSeconds: 2
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: liveness-port
          timeoutSeconds: 2
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
