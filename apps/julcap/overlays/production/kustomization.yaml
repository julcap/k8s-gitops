apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: julcap-production

labels:
  - pairs:
      env: production


resources:
  - ../../base

images:
  - name: registry.julcap.net/julcap/front-end
    newTag: "44096861"
  - name: registry.julcap.net/julcap/back-end
    newTag: "44096861"

replicas:
  - name: julcap-front-end
    count: 1
  - name: julcap-api
    count: 1

patches:
  # JSON 6902 patch
  - target:
      kind: Ingress
      name: julcap-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: tools-k8s.julcap.net
  # strategic merge patch
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: julcap-api
      spec:
        template:
          spec:
            containers:
              - name: julcap-api
                env:
                  - name: CORS_ORIGIN
                    value: https://tools-k8s.julcap.net
                  - name: EMAIL_PROVIDER
                    value: "resend"
                  - name: EMAIL_FROM
                    value: "main@julcap.net"