apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: julcap-ingress
spec:
  rules:
    - host: dev-tools.julcap.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-end
                port:
                  number: 80

