apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: db
spec:
  ports:
  - port: 5432
    name: postgres
  clusterIP: None
  selector:
    app: db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  selector:
    matchLabels:
      app: db
  serviceName: "postgres"
  replicas: 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: db
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: postgres
        image: postgres:15-alpine
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        envFrom:
        - secretRef:
            name: pg-conf
        ports:
        - containerPort: 5432
          name: db
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ['sh','-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
          failureThreshold: 3
          timeoutSeconds: 2
          periodSeconds: 5
          initialDelaySeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOncePod" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 5Gi

