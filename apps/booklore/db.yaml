apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: booklore
spec:
  clusterIP: None
  selector:
    app: mariadb
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: booklore
spec:
  replicas: 1
  serviceName: mariadb
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      nodeSelector:
        kubernetes.io/hostname: jca-ds10u
        #tolerations:
        #- key: node-role.kubernetes.io/control-plane
        #  operator: Exists
        #  effect: NoSchedule
      containers:
        - name: mariadb
          image: lscr.io/linuxserver/mariadb:11.4.5
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: Etc/UTC }
            - { name: MYSQL_DATABASE, value: booklore }
            - { name: MYSQL_USER, value: booklore }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: booklore-db, key: root-password }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: booklore-db, key: password }
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h localhost"]
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          hostPath:
            path: /var/lib/booklore/mariadb
            type: Directory
